# cargo-deny v2 configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# All suppressions are transitive Substrate/Polkadot-SDK dependencies with no
# upstream fix available. 7aychain does not use the affected code paths directly.
# Reviewed: 2026-04-11. Re-evaluate each release.
ignore = [
    # bytes v1.x: integer overflow in BytesMut::reserve (transitive via networking)
    "RUSTSEC-2026-0007",
    # ring: AES panic when overflow checks enabled (transitive via libp2p/schnorrkel)
    "RUSTSEC-2025-0009",
    # time: DoS via stack exhaustion in parsing (transitive via substrate telemetry)
    "RUSTSEC-2026-0009",
    # wasmtime: f64.copysign segfault on x86-64 (WASM executor, not user-reachable)
    "RUSTSEC-2026-0006",
    # libp2p-identity: timing side-channel in key comparison (transitive via sc-network)
    "RUSTSEC-2026-0020",
    # prost: stack overflow on deeply nested messages (transitive via tonic/libp2p)
    "RUSTSEC-2026-0021",
    # tokio: resource exhaustion via unbounded task spawn (transitive via sc-service)
    "RUSTSEC-2026-0012",
    # rustls: certificate verification bypass (transitive via reqwest/hyper, not used)
    "RUSTSEC-2026-0037",
    # h2: memory exhaustion via CONTINUATION frames (transitive via hyper/substrate-rpc)
    "RUSTSEC-2026-0049",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MIT-0",
    "0BSD",
    "MPL-2.0",
    "BUSL-1.1",
    "OpenSSL",
    "GPL-3.0-or-later WITH Classpath-exception-2.0",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["GPL-3.0"], crate = "chain-spec-builder" },
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
