<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$title</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(17, 24, 39, 0.94);
      --line: #223147;
      --ink: #eaf2ff;
      --muted: #93a4bb;
      --accent: #38bdf8;
    }
    body {
      margin: 0;
      padding: 2rem;
      font-family: "Inter", "IBM Plex Sans", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.22), transparent 28%),
        radial-gradient(circle at top right, rgba(16, 185, 129, 0.14), transparent 24%),
        var(--bg);
      color: var(--ink);
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
      font-size: 0.75rem;
      margin-bottom: 0.5rem;
    }
    h1 { margin: 0; font-size: clamp(2rem, 4vw, 3.4rem); }
    p { line-height: 1.55; }
    .subtle { color: var(--muted); max-width: 70ch; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0 2rem;
    }
    .stat, .card {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border-radius: 18px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.18);
    }
    .stat {
      padding: 1rem 1.1rem;
    }
    .stat .label {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
    }
    .stat .value {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .card {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(220px, 280px);
      gap: 1.25rem;
      margin: 1rem 0;
      padding: 1.25rem;
      background: var(--panel);
    }
    .status {
      color: var(--accent);
      font-weight: 700;
      margin: 0.25rem 0 0.5rem;
    }
    .links a {
      display: inline-block;
      margin-right: 0.75rem;
      color: var(--accent);
      text-decoration: none;
    }
    .qr {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr img {
      width: 240px;
      height: 240px;
      padding: 0.5rem;
      border-radius: 18px;
      background: white;
    }
    pre {
      margin: 0.6rem 0 0;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 0.75rem;
      border-radius: 12px;
      background: rgba(8, 15, 28, 0.92);
      border: 1px solid var(--line);
      color: #dbeafe;
    }
    .empty {
      padding: 1rem 1.2rem;
      border: 1px dashed var(--line);
      border-radius: 14px;
      color: var(--muted);
    }
    @media (max-width: 760px) {
      body { padding: 1rem; }
      .card { grid-template-columns: 1fr; }
      .qr img { width: 100%; max-width: 260px; height: auto; }
    }
  </style>
</head>
<body>
  <div class="eyebrow">Mock SM-DP+ / eSIM provisioning</div>
  <h1>$title</h1>
  <p class="subtle">$subtitle</p>
  <div class="stats">
    <div class="stat"><div class="label">Profiles</div><div class="value">$profile_count</div></div>
    <div class="stat"><div class="label">Active</div><div class="value">$active_count</div></div>
    <div class="stat"><div class="label">Source</div><div class="value">$source_path</div></div>
    <div class="stat"><div class="label">Discovery</div><div class="value"><a href="$discovery_url">$discovery_url</a></div></div>
  </div>
  $cards
</body>
</html>
