; Base PJSIP config for the 7AY telecom devnet.

[global]
type=global
user_agent=7AYchain Devnet

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
cert_file=/etc/asterisk/certs/cert.pem
priv_key_file=/etc/asterisk/certs/key.pem

#include "pjsip.generated.conf"
