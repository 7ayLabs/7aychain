name: seveny-telecom-stack

services:
  asterisk:
    image: andrius/asterisk:18
    container_name: seveny-asterisk
    ports:
      - "${TELECOM_BIND_IP:-0.0.0.0}:5060:5060/udp"
      - "${TELECOM_BIND_IP:-0.0.0.0}:5060:5060/tcp"
      - "${TELECOM_BIND_IP:-0.0.0.0}:5061:5061/tcp"
      - "${TELECOM_BIND_IP:-0.0.0.0}:8089:8089/tcp"
      - "${TELECOM_BIND_IP:-0.0.0.0}:10000-10020:10000-10020/udp"
    volumes:
      - ./telecom/asterisk/pjsip.base.conf:/etc/asterisk/pjsip.conf:ro
      - ./telecom/asterisk/extensions.base.conf:/etc/asterisk/extensions.conf:ro
      - ./telecom/generated/pjsip.generated.conf:/etc/asterisk/pjsip.generated.conf:ro
      - ./telecom/generated/extensions.generated.conf:/etc/asterisk/extensions.generated.conf:ro
      - ./telecom/asterisk/ari.conf:/etc/asterisk/ari.conf:ro
      - ./telecom/asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./telecom/certs:/etc/asterisk/certs:ro
      - ./telecom/webrtc:/var/lib/asterisk/static-http/webrtc:ro
    restart: unless-stopped

  kamailio:
    image: kamailio/kamailio:latest
    container_name: seveny-kamailio
    depends_on:
      - asterisk
    ports:
      - "${TELECOM_BIND_IP:-0.0.0.0}:5062:5060/udp"
      - "${TELECOM_BIND_IP:-0.0.0.0}:5062:5060/tcp"
    volumes:
      - ./telecom/ims/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./telecom/ims/dispatcher.list:/etc/kamailio/dispatcher.list:ro
    command:
      - kamailio
      - -DD
      - -E
      - -f
      - /etc/kamailio/kamailio.cfg
    restart: unless-stopped
